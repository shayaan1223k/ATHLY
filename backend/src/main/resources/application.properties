# Server Configuration
server.port=${PORT:8080}

# Application Name
spring.application.name=ATHLY

# MongoDB Configuration
# Supports standard MONGODB_URI (e.g. MongoDB Atlas on Render) or SPRING_DATA_MONGODB_URI with localhost athly_dev fallback
spring.data.mongodb.uri=${MONGODB_URI:${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/athly_dev}}

# Enable automatic index creation for MongoDB collections
spring.data.mongodb.auto-index-creation=true

# Development Identity Mode:
# When true, /api/profile/me falls back to an isolated local dev user ('dev-local-user') for development.
# When false (default / production), requests without verified authentication fail closed with 401 Unauthorized.
athly.dev.auth-mock-enabled=${DEV_AUTH_MOCK_ENABLED:false}

# CORS Allowed Origins
# Configurable via CORS_ALLOWED_ORIGINS (e.g. for Vercel production frontend)
athly.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Python FastAPI AI Microservice URL
athly.ai-service.url=${AI_SERVICE_URL:http://localhost:8000}

# Firebase Admin SDK Configuration
# Supports service-account file path (FIREBASE_CREDENTIALS_PATH) or raw service account JSON (FIREBASE_CREDENTIALS_JSON).
# In production on Render, set FIREBASE_CREDENTIALS_JSON to the JSON string content.
# If unset, attempts Google Application Default Credentials.
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}
firebase.credentials.json=${FIREBASE_CREDENTIALS_JSON:}
firebase.project.id=${FIREBASE_PROJECT_ID:}

